<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kompetent · Digitaler Bürgerassistent 2030 (Pitch Deck)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --kp-flag: #E1320F;
      --kp-textred: #B92B06;
      --kp-navy: #002D66;
      --kp-darkblue: #001E44;
      --kp-bluegrey: #E5E9F0;
      --kp-bluegrey-60: #F0F3F7;
      --kp-sand: #F7F5F0;
      --kp-sand-60: #FAF9F6;
      --kp-verified: #15803d;
      --kp-black: #0F172A;
      --kp-muted: #64748B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0A0F1D;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Deck Container */
    #deck {
      position: relative;
      width: 92vw;
      max-width: 1320px;
      aspect-ratio: 16 / 9;
      background: #FFFFFF;
      color: var(--kp-black);
      border-radius: 12px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
    }

    /* Fullscreen mode */
    body.is-fullscreen #deck {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      border-radius: 0;
      aspect-ratio: auto;
    }

    /* Top Ribbon */
    .ci-header {
      height: 60px;
      padding: 0 40px;
      border-bottom: 1px solid var(--kp-bluegrey);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .flag-bar {
      width: 24px;
      height: 16px;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .flag-bar div:nth-child(1), .flag-bar div:nth-child(3) { background: var(--kp-flag); flex: 1; }
    .flag-bar div:nth-child(2) { background: #FFFFFF; flex: 1; }

    .brand-title {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      color: var(--kp-navy);
    }

    .brand-title span {
      color: var(--kp-textred);
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .lang-switcher {
      display: flex;
      background: var(--kp-bluegrey-60);
      border: 1px solid var(--kp-bluegrey);
      border-radius: 6px;
      padding: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--kp-muted);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .lang-btn.active {
      background: var(--kp-navy);
      color: #FFFFFF;
    }

    .meta-tag {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--kp-muted);
      background: var(--kp-bluegrey-60);
      padding: 5px 12px;
      border-radius: 4px;
    }

    /* Slide Stage */
    .slide-stage {
      flex: 1;
      padding: 40px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow-y: auto;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Typography */
    h1 {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--kp-navy);
      margin-bottom: 16px;
    }

    h2 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--kp-navy);
      margin-bottom: 22px;
    }

    p.lead {
      font-size: 1.25rem;
      line-height: 1.5;
      color: #334155;
      max-width: 900px;
      margin-bottom: 28px;
    }

    /* Grid Layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: stretch;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 24px;
      align-items: stretch;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .card {
      background: var(--kp-sand-60);
      border: 1px solid var(--kp-bluegrey);
      border-radius: 8px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card.highlight {
      background: #FFFFFF;
      border: 2px solid var(--kp-navy);
      box-shadow: 0 10px 25px -5px rgba(0, 45, 102, 0.08);
    }

    .card-tag {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--kp-textred);
    }

    .card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--kp-navy);
      line-height: 1.3;
    }

    .card p {
      font-size: 0.92rem;
      line-height: 1.5;
      color: #475569;
    }

    /* Stat Box */
    .stat-box {
      background: var(--kp-bluegrey-60);
      border-left: 4px solid var(--kp-navy);
      padding: 16px 20px;
      border-radius: 0 8px 8px 0;
    }
    .stat-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--kp-navy);
      line-height: 1;
    }
    .stat-desc {
      font-size: 0.85rem;
      font-weight: 500;
      color: #475569;
      margin-top: 4px;
    }

    /* Badges */
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .badge {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #F1F5F9;
      color: #334155;
    }
    .badge.verified {
      background: #DCFCE7;
      color: #166534;
      border: 1px solid #BBF7D0;
    }

    /* Flow Step */
    .flow-step {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 14px 18px;
      background: #FFFFFF;
      border: 1px solid var(--kp-bluegrey);
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .step-num {
      width: 28px;
      height: 28px;
      background: var(--kp-navy);
      color: #FFF;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .step-content h4 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--kp-navy);
      margin-bottom: 2px;
    }
    .step-content p {
      font-size: 0.85rem;
      color: #475569;
      line-height: 1.4;
    }

    /* Footer */
    .ci-footer {
      height: 56px;
      padding: 0 40px;
      border-top: 1px solid var(--kp-bluegrey);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FAFAFA;
      font-size: 0.85rem;
      color: var(--kp-muted);
      z-index: 10;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button.ctrl-btn {
      background: #FFFFFF;
      border: 1px solid var(--kp-bluegrey);
      color: var(--kp-navy);
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button.ctrl-btn:hover {
      background: var(--kp-navy);
      color: #FFFFFF;
      border-color: var(--kp-navy);
    }

    button.ctrl-btn.active {
      background: var(--kp-navy);
      color: #FFFFFF;
    }

    /* Notes Drawer */
    #notes {
      position: absolute;
      bottom: 56px;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      color: #E2E8F0;
      padding: 20px 40px;
      font-size: 0.95rem;
      line-height: 1.6;
      border-top: 2px solid var(--kp-textred);
      display: none;
      backdrop-filter: blur(8px);
      max-height: 35%;
      overflow-y: auto;
      z-index: 20;
    }

    #notes.active {
      display: block;
    }

    /* Progress bar */
    #progress-bar {
      height: 3px;
      background: var(--kp-textred);
      width: 0%;
      position: absolute;
      bottom: 54px;
      left: 0;
      z-index: 15;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>

  <div id="deck">
    <!-- Header -->
    <header class="ci-header">
      <div class="brand">
        <div class="flag-bar">
          <div></div><div></div><div></div>
        </div>
        <div class="brand-title">Kompetent <span id="brand-tagline">· Digitaler Bürgerassistent 2030</span></div>

          <button class="lang-btn active" id="btn-de" onclick="setLang('de')">DE</button>
          <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
        </div>
        <div class="meta-tag" id="meta-category">DIGITALE ASSISTENTEN 2030</div>
      </div>
    </header>

    <!-- Slide Content Stage -->
    <main class="slide-stage" id="stage"></main>

    <!-- Progress Bar -->
    <div id="progress-bar"></div>

    <!-- Notes Drawer -->
    <div id="notes"></div>

    <!-- Footer Controls -->
    <footer class="ci-footer">
      <div>
        <span id="slide-counter">Folie 1 von 11</span>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="btn-fullscreen" onclick="toggleFullScreen()" title="Vollbildmodus umschalten [Taste F]">
          ⛶ <span id="txt-fullscreen">Vollbild (F)</span>
        </button>

          📝 <span id="txt-notes">Notizen (N)</span>
        </button>
        <button class="ctrl-btn" onclick="prevSlide()" title="Vorherige Folie [Pfeil Links]">
          ← <span id="txt-prev">Zurück</span>
        </button>
        <button class="ctrl-btn" onclick="nextSlide()" title="Nächste Folie [Pfeil Rechts / Leertaste]">
          <span id="txt-next">Weiter</span> →
        </button>
      </div>
    </footer>
  </div>

    let currentLang = 'de';
    let currentIdx = 0;

    const stageEl = document.getElementById('stage');
    const counterEl = document.getElementById('slide-counter');
    const notesEl = document.getElementById('notes');
    const progressBar = document.getElementById('progress-bar');
    const brandTagline = document.getElementById('brand-tagline');
    const metaCategory = document.getElementById('meta-category');
    const txtFullscreen = document.getElementById('txt-fullscreen');
    const txtNotes = document.getElementById('txt-notes');
    const txtPrev = document.getElementById('txt-prev');
    const txtNext = document.getElementById('txt-next');
    const btnDe = document.getElementById('btn-de');
    const btnEn = document.getElementById('btn-en');
    const btnNotes = document.getElementById('btn-notes');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    function setLang(lang) {
      if (lang !== 'de' && lang !== 'en') return;
      currentLang = lang;
      
      btnDe.classList.toggle('active', lang === 'de');
      btnEn.classList.toggle('active', lang === 'en');
      
      const l = deckData[lang];
      brandTagline.textContent = l.brandTagline;
      metaCategory.textContent = l.metaCategory;
      txtFullscreen.textContent = l.txtFullscreen;
      txtNotes.textContent = l.txtNotes;
      txtPrev.textContent = l.txtPrev;
      txtNext.textContent = l.txtNext;
      
      renderSlide();
    }

    function renderSlide() {
      const l = deckData[currentLang];
      const slides = l.slides;
      const slide = slides[currentIdx];

      stageEl.innerHTML = slide.html;
      counterEl.textContent = `${l.counterPrefix} ${currentIdx + 1} ${l.counterOf} ${slides.length}`;
      notesEl.textContent = slide.notes || 'No speaker notes.';

      const progress = ((currentIdx + 1) / slides.length) * 100;
      progressBar.style.width = `${progress}%`;
    }

    function nextSlide() {
      if (currentIdx < deckData[currentLang].slides.length - 1) {
        currentIdx++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentIdx > 0) {
        currentIdx--;
        renderSlide();
      }
    }

    function toggleNotes() {
      const isActive = notesEl.classList.toggle('active');
      btnNotes.classList.toggle('active', isActive);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          document.body.classList.add('is-fullscreen');
          btnFullscreen.classList.add('active');
        }).catch(() => {
          // Fallback CSS fullscreen
          document.body.classList.toggle('is-fullscreen');
          btnFullscreen.classList.toggle('active');
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().then(() => {
            document.body.classList.remove('is-fullscreen');
            btnFullscreen.classList.remove('active');
          }).catch(() => {});
        }
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      document.body.classList.toggle('is-fullscreen', isFs);
      btnFullscreen.classList.toggle('active', isFs);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 'n') {
        toggleNotes();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
      } else if (e.key.toLowerCase() === 'l') {
        setLang(currentLang === 'de' ? 'en' : 'de');
      }
    });

    // Initial render
    setLang('de');
  </script>
